# equipose dashboard theme — "graphite instrument, on paper" (Apple HIG)
# Warm-light clinical: cool paper surface, slate-blue emphasis, navy ink.
# JetBrains Mono self-hosted via static serving (offline, no CDN); SF is OS-provided.
# See .impeccable.md / CLAUDE.md for the design context.
[theme]
base = "light"
primaryColor = "#415A69"             # slate-blue — the one emphasis tone
backgroundColor = "#E7EDEF"          # cool light ground
secondaryBackgroundColor = "#FFFFFF" # white card surface (matches CSS --panel)
textColor = "#0C1013"                # near-black navy ink
font = "sans serif"

[server]
headless = true
enableStaticServing = true           # serve self-hosted fonts at app/static/ (local, offline)

[browser]
gatherUsageStats = false
