# equipose dashboard theme — "graphite instrument" (Apple HIG)
# Dark warm-charcoal (not cold blue-black). Single warm-bone emphasis (no pink).
# JetBrains Mono self-hosted via static serving (offline, no CDN); SF is OS-provided.
# See .impeccable.md / CLAUDE.md for the design context.
[theme]
base = "dark"
primaryColor = "#FBF5EF"             # warm bone — the one emphasis tone
backgroundColor = "#17120F"          # warm near-black charcoal
secondaryBackgroundColor = "#1E1814" # warm panel (matches CSS --panel)
textColor = "#F2E9E2"                # warm off-white
font = "sans serif"

[server]
headless = true
enableStaticServing = true           # serve self-hosted fonts at app/static/ (local, offline)

[browser]
gatherUsageStats = false
